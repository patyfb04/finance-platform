name: Prod Workflow

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  merge-stage-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Patricia"
          git config user.email "patyfb04@gmail.com"

      - name: Fetch stage branch
        run: git fetch origin stage

      - name: Merge stage into main
        run: |
          git merge origin/stage --no-ff -m "Merge stage into main [$(date)]"
          git push origin main

  call-common-deploy:
    needs: merge-stage-to-main
    uses: ./.github/workflows/common-deploy.yml
    with:
      bun-version: "latest"
