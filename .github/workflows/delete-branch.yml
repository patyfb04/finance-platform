name: Delete merged feature branches

on:
  pull_request:
    types: [closed]
    branches:
      - dev

jobs:
  delete-branch:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'features/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch
        uses: peter-evans/delete-branch@v3
        with:
          branch: ${{ github.event.pull_request.head.ref }}
