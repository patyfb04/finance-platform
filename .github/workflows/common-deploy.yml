name: Common Bun Deploy

on:
  workflow_call:
    inputs:
      bun-version:
        required: true
        type: string

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test:run

      - name: Run linting
        run: bun run lint

      - name: Run type checking
        run: bun run type-check

      - name: Build
        run: bun run build
